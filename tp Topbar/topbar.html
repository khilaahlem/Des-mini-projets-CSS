<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topbar Responsive - TP5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="topbar">
        <div class="topbar__container">
            <ul class="topbar__infos">
                <li>
                    <svg class="icon">
                        <use xlink:href="images/sprite.svg#phone"></use>
                    </svg>
                    +216 71 234 567
                </li>
                <li>
                    <svg class="icon">
                        <use xlink:href="images/sprite.svg#print"></use>
                    </svg>
                    +216 71 234 568
                </li>
                <li>
                    <svg class="icon">
                        <use xlink:href="images/sprite.svg#mail"></use>
                    </svg>
                  email@example.com
                </li>
            </ul>
            <ul class="topbar__links">
                <li><a href="#">
                    <svg class="icon">
                        <use xlink:href="images/sprite.svg#edit"></use>
                    </svg>
                    S'inscrire
                </a></li>
                <li><a href="#">
                    <svg class="icon">
                        <use xlink:href="images/sprite.svg#key"></use>
                    </svg>
                    Se connecter
                </a></li>
                <li class="topbar__lang"><a href="#">com</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <h1>Topbar Responsive</h1>
        <p>Contenu principal de la page</p>
    </main>
</body>
</html>
